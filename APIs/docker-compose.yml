services:
  auth-api-dev:
    image: ghcr.io/minhavan/auth-api-dev:latest
    container_name: auth-api-dev
    ports:
      - "19001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - services-dev

  router-api-dev:
    image: ghcr.io/minhavan/router-api-dev:latest
    container_name: router-api-dev
    ports:
      - "19002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - services-dev

  payments-api-dev:
    image: ghcr.io/minhavan/payments-api-dev:latest
    container_name: payments-api-dev
    ports:
      - "19003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - services-dev

  pessoas-api-dev:
    image: ghcr.io/minhavan/pessoas-api-dev:latest
    container_name: pessoas-api-dev
    ports:
      - "19004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - services-dev

  localizacao-consumer-dev:
    image: ghcr.io/minhavan/localizacao-consumer-dev:latest
    container_name: localizacao-consumer-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - services-dev

  email-consumer-dev:
    image: ghcr.io/minhavan/email-consumer-dev:latest
    container_name: email-consumer-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
    networks:
      - services-dev

  van-app-dev:
    image: ghcr.io/minhavan/van-app-dev:latest
    ports:
      - "19006:80"
    restart: unless-stopped
    networks:
      - services-dev

  gateway-api-dev:
    image: ghcr.io/minhavan/gateway-api-dev:latest
    container_name: gateway-api-dev
    ports:
      - "19005:8080"
    depends_on:
      - auth-api-dev
      - router-api-dev
      - payments-api-dev
      - pessoas-api-dev
    environment:
      - ENV=Development
    networks:
      - services-dev

networks:
  services-dev:
    external: true
